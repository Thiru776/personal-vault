name: Vault Alert Email Digest

on:
  schedule:
    # Runs at 03:30 UTC (09:00 AM IST) every 2 days
    - cron: '30 3 */2 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install @supabase/supabase-js nodemailer dotenv

      - name: Run Alert Digest Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node scripts/send-alerts.js
